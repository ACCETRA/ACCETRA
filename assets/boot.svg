<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="ACCETRA terminal booting: front end developer Muhammad Ammad Kiyani">
  <title>ACCETRA terminal, booting</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcc4"/><stop offset="1" stop-color="#93979f"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7ce8"/><stop offset=".45" stop-color="#0a56d6"/><stop offset="1" stop-color="#0733a0"/>
    </linearGradient>
    <radialGradient id="tube" cx=".5" cy=".4" r=".78">
      <stop offset="0" stop-color="#050c08"/><stop offset="1" stop-color="#020604"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".72">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff8c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff8c" stop-opacity=".085"/>
      <stop offset="1" stop-color="#00ff8c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".26"/>
    </pattern>
    <filter id="glow" x="-12%" y="-40%" width="124%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="4" y="30" width="892" height="326"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .dim { fill:#3d7754; font-size:13px; }
    .hot { fill:#dcffe8; font-size:13px; }
    .fg  { fill:#86f5a8; font-size:13px; }
    .w   { fill:#86f5a8; animation:strike 1.05s ease-out both; }
    .ln  { animation:typein .34s steps(12) both; }
    .sweep { animation:sweep 7s linear infinite; }
    .caret { fill:#86f5a8; animation:hold 4.1s steps(1) both, blink 1.05s steps(1) infinite 4.1s; }
    .prompt { animation:typein .3s steps(6) both; animation-delay:4.05s; }
    .shut { opacity:0; animation:blinkB 4.6s steps(1) infinite; }
    .open { animation:blinkA 4.6s steps(1) infinite; }
    .bubble { animation:typein .4s steps(14) both; animation-delay:4.4s; }
    @keyframes strike {
      0%   { opacity:0; fill:#dcffe8; }
      6%   { opacity:1; fill:#dcffe8; }
      100% { opacity:1; fill:#86f5a8; }
    }
    @keyframes typein { from { opacity:0 } to { opacity:1 } }
    @keyframes hold   { from { opacity:0 } to { opacity:1 } }
    @keyframes blink  { 50% { opacity:0 } }
    @keyframes sweep  { from { transform:translateY(-150px) } to { transform:translateY(360px) } }
    @keyframes blinkA { 0%,95.5% { opacity:1 } 96%,98.5% { opacity:0 } 99%,100% { opacity:1 } }
    @keyframes blinkB { 0%,95.5% { opacity:0 } 96%,98.5% { opacity:1 } 99%,100% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) {
      .w,.ln,.caret,.sweep,.prompt,.open,.shut,.bubble { animation:none; opacity:1 }
      .shut { opacity:0 }
    }
  </style>

  <rect width="900" height="360" rx="9" fill="url(#bezel)"/>
  <rect x="4" y="4" width="892" height="24" rx="4" fill="url(#chrome)"/>
  <text x="14" y="21" fill="#ffffff" font-size="11" font-weight="700">C:\ACCETRA\PROFILE.SYS</text>
  <text x="196" y="21" fill="#ffffff" font-size="11" opacity=".72">[16 bit MS DOS subsystem]</text>
  <g stroke="#ffffff" stroke-opacity=".85" fill="#2f61c4">
    <rect x="820" y="8" width="20" height="16" rx="3"/>
    <rect x="844" y="8" width="20" height="16" rx="3"/>
    <rect x="868" y="8" width="20" height="16" rx="3" fill="#c0392b"/>
  </g>
  <rect x="4" y="30" width="892" height="326" fill="url(#tube)"/>

