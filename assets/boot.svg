    <text class="ln dim" x="36" y="169" style="animation-delay:1.75s">Memory test: 65536K OK</text>
    <text class="ln dim" x="36" y="190" style="animation-delay:2.2s">Detecting display adapter: CRT, P1 phosphor</text>
